#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2}
.stage{position:relative;flex:none;border-radius:3px;opacity:0;transform:translateY(40px) scale(.9);filter:blur(8px);
 box-shadow:0 2px 4px rgba(60,10,15,.18),0 18px 40px rgba(90,15,20,.22),0 40px 90px rgba(90,15,20,.18);transition:opacity 1.2s ease,transform 1.4s cubic-bezier(.2,.9,.2,1),filter 1.2s ease}
.stage.shown{opacity:1;transform:none;filter:none}
.stage img,.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block;border-radius:3px}
.stage img{pointer-events:none}
#pad{touch-action:none;cursor:crosshair}
.stage.tense{box-shadow:0 0 0 1px rgba(212,162,60,.5),0 20px 60px rgba(212,162,60,.35),0 50px 120px rgba(90,15,20,.25)}
.stage.tense #pad{filter:drop-shadow(0 0 6px #ffd76a) drop-shadow(0 0 16px #ffb83a)}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,250,235,.95),rgba(255,240,200,0) 70%)}
.sweep{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(110deg,transparent 35%,rgba(255,248,225,.6) 50%,transparent 65%);background-size:300% 100%}
.stage.launch .flash{animation:flash 1.4s ease-out}
.stage.launch .sweep{animation:sweep 1.8s ease-out .2s}
.stage.launch{animation:pop .7s ease}
@keyframes flash{12%{opacity:1}100%{opacity:0}}
@keyframes sweep{0%{opacity:1;background-position:120% 0}100%{opacity:1;background-position:-60% 0}}
@keyframes pop{30%{transform:scale(1.025)}}
.gold{background:linear-gradient(100deg,#9a6b1c 10%,#d9a645 30%,#f6dc94 45%,#c8922f 60%,#8a5d16 80%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 5s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-130% 0}}

/* intro */
.intro{position:absolute;inset:0;z-index:10;cursor:pointer;overflow:hidden;transition:opacity .9s .5s,visibility 0s 1.5s}
.intro.open{opacity:0;visibility:hidden;pointer-events:none}
#dust{position:absolute;inset:0;width:100%;height:100%}
.glow{position:absolute;left:50%;top:38%;width:70cqmin;height:70cqmin;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(240,205,130,.35),rgba(240,205,130,0) 65%);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{transform:translate(-50%,-50%) scale(1.12);opacity:.7}}
.intro .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.emb{position:relative;width:clamp(150px,26cqw,300px);aspect-ratio:2/1;display:flex;align-items:center;justify-content:center;transition:transform 1s cubic-bezier(.6,-0.3,.3,1),opacity .7s}
.intro.open .emb{transform:scale(2.4) translateY(-6%);opacity:0}
.intro.open .txt{opacity:0;transform:translateY(14px);transition:all .5s}
.halo{position:absolute;width:150%;aspect-ratio:1;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(200,150,50,.65),transparent 28%,transparent 50%,rgba(200,150,50,.5),transparent 78%);-webkit-mask:radial-gradient(circle,transparent 58.5%,#000 60%,#000 61%,transparent 62.5%);mask:radial-gradient(circle,transparent 58.5%,#000 60%,#000 61%,transparent 62.5%);animation:spin 7s linear infinite}
.halo.h2{width:122%;animation-duration:11s;animation-direction:reverse;opacity:.6}
@keyframes spin{to{transform:rotate(360deg)}}

@keyframes float{50%{transform:translateY(-7px)}}
.txt{display:flex;flex-direction:column;align-items:center}
.kick{margin-top:clamp(18px,5cqh,44px);font-size:clamp(10px,1.3cqw,14px);font-weight:400;letter-spacing:.55em;color:#a48a62;text-indent:.55em}
.intro h2{margin-top:clamp(6px,1.2cqh,12px);font-size:clamp(28px,5.6cqw,68px);font-weight:300;letter-spacing:.18em;text-indent:.18em;line-height:1.1}
.line{width:clamp(120px,22cqw,260px);height:1px;margin:clamp(12px,2.6cqh,24px) 0;background:linear-gradient(90deg,transparent,#c99a3e,transparent);position:relative}
.line:after{content:"";position:absolute;left:50%;top:50%;width:7px;height:7px;background:#c99a3e;transform:translate(-50%,-50%) rotate(45deg)}
.intro p{font-size:clamp(11px,1.5cqw,16px);font-weight:400;letter-spacing:.42em;text-indent:.42em;color:#6b5236}
.cta{margin-top:clamp(20px,5.5cqh,48px);font-size:clamp(11px,1.2cqw,13px);font-weight:600;letter-spacing:.42em;text-indent:.42em;color:#fff;padding:15px 34px;border-radius:40px;background:linear-gradient(135deg,#c2902f,#e8c26a 50%,#b07c22);box-shadow:0 10px 26px rgba(176,124,34,.35),inset 0 1px 0 rgba(255,255,255,.5);position:relative;overflow:hidden;animation:breathe 2.4s ease-in-out infinite}
.cta:after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-60%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);animation:glint 2.8s ease-in-out infinite}
@keyframes glint{60%,100%{left:130%}}
@keyframes breathe{50%{transform:scale(1.04);box-shadow:0 14px 34px rgba(176,124,34,.45),inset 0 1px 0 rgba(255,255,255,.5)}}
.lg{position:absolute;top:clamp(18px,3cqh,28px);right:clamp(20px,3cqw,34px);background:rgba(255,255,255,.7);border:1px solid rgba(190,150,70,.45);color:#9a6b1c;font:600 11px "Josefin Sans",sans-serif;letter-spacing:.15em;padding:7px 13px 5px;border-radius:20px;cursor:pointer;z-index:2}
.ring{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);border-radius:50%;border:2px solid #d4a23c;box-shadow:0 0 24px rgba(212,162,60,.6);pointer-events:none;z-index:9;animation:wave 1.5s ease-out forwards}
@keyframes wave{from{width:20px;height:20px;opacity:1}to{width:240cqmax;height:240cqmax;opacity:0}}
.rays{position:absolute;inset:-60%;z-index:1;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(212,162,60,.13) 0 4deg,transparent 5deg 15deg);transition:opacity 1.2s;animation:spin 40s linear infinite}
.rays.on{opacity:1}

/* controls */
.tools{position:absolute;left:50%;bottom:clamp(16px,3.2cqh,30px);transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:40px;background:rgba(255,255,255,.8);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(190,150,70,.35);box-shadow:0 10px 30px rgba(80,50,10,.15);z-index:4;transition:opacity .5s,transform .5s}
.tools.ghost{opacity:0;transform:translateX(-50%) translateY(20px);pointer-events:none}
.tb{border:0;background:none;color:#8a5d16;font:600 12px "Josefin Sans",sans-serif;letter-spacing:.14em;padding:11px 18px 9px;border-radius:30px;cursor:pointer;white-space:nowrap}
.tb.main{background:linear-gradient(135deg,#c2902f,#e8c26a 50%,#b07c22);color:#fff}
.erase{position:absolute;right:clamp(20px,3cqw,34px);bottom:clamp(16px,3.2cqh,30px);z-index:4;border:1px solid rgba(190,150,70,.45);background:rgba(255,255,255,.85);color:#9a6b1c;font:600 11px "Josefin Sans",sans-serif;letter-spacing:.15em;padding:8px 14px 6px;border-radius:20px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s}
.erase.on{opacity:1;pointer-events:auto}
#fx{position:absolute;inset:0;pointer-events:none;z-index:5}

/* announcement */
.ann{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;opacity:0;transition:opacity .7s;background:rgba(252,249,244,.86);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px)}
.ann.show{opacity:1}
.ann>*{opacity:0;transform:translateY(22px);transition:all .9s cubic-bezier(.2,1,.3,1)}
.ann.show>*{opacity:1;transform:none}
.ann .a1{font-size:clamp(11px,1.5cqw,17px);letter-spacing:.6em;text-indent:.6em;color:#a48a62;transition-delay:.1s}
.ann .a2{margin-top:clamp(8px,1.6cqh,16px);font-size:clamp(26px,5.4cqw,70px);font-weight:300;letter-spacing:.16em;text-indent:.16em;line-height:1.1;transition-delay:.45s}
.ann .a3{margin-top:clamp(6px,1.2cqh,12px);font-size:clamp(11px,1.5cqw,17px);letter-spacing:.45em;text-indent:.45em;color:#6b5236;transition-delay:.8s}
.ann .orn{width:clamp(200px,34cqw,440px);margin:clamp(12px,2.6cqh,24px) 0;transition-delay:1.1s}
.ann .a4{font-size:clamp(34px,7.6cqw,100px);font-weight:600;letter-spacing:.2em;text-indent:.2em;line-height:1;transition-delay:1.5s}
.ann .a5{margin-top:clamp(14px,3cqh,28px);font-size:clamp(10px,1.2cqw,13px);letter-spacing:.4em;text-indent:.4em;color:#a48a62;transition-delay:2s}
.ann .logo{width:clamp(80px,10cqw,130px);height:clamp(40px,5cqw,65px);margin-bottom:clamp(10px,2.4cqh,22px);animation:none}

.modal{position:absolute;inset:0;background:rgba(250,247,242,.97);z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.modal.open{display:flex}
