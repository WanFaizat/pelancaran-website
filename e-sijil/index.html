<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<title>Sijil Penghargaan 5G Associates, Tandatangan</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#140304;overscroll-behavior:none}
body{font-family:"Cinzel",Georgia,serif;color:#f6e7c1;user-select:none;-webkit-user-select:none;touch-action:none}
#app{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden;container-type:size;transform-origin:0 0}
#wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.stage{position:relative;flex:none;box-shadow:0 0 80px rgba(0,0,0,.8);transition:filter 1s}
.stage img,.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage img{pointer-events:none}
#pad{touch-action:none;cursor:crosshair}
.stage.tense{filter:brightness(.8)}
.stage.tense #pad{filter:drop-shadow(0 0 6px #ffd76a) drop-shadow(0 0 14px #ffb83a)}
.flash{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle,rgba(255,236,180,.9),rgba(255,200,90,0) 70%)}
.sweep{position:absolute;inset:0;pointer-events:none;opacity:0;background:linear-gradient(110deg,transparent 35%,rgba(255,244,210,.6) 50%,transparent 65%);background-size:300% 100%}
.stage.launch .flash{animation:flash 1.4s ease-out}
.stage.launch .sweep{animation:sweep 1.8s ease-out .2s}
.stage.launch{animation:shake .5s ease}
@keyframes flash{12%{opacity:1}100%{opacity:0}}
@keyframes sweep{0%{opacity:1;background-position:120% 0}100%{opacity:1;background-position:-60% 0}}
@keyframes shake{20%{translate:-6px 3px}40%{translate:5px -4px}60%{translate:-3px 2px}80%{translate:2px -1px}}

/* intro: dark stage, spotlights, gold dust */
.intro{position:absolute;inset:0;z-index:10;cursor:pointer;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#2a0507,#0b0102 70%);transition:opacity 1.2s .5s}
.intro.open{opacity:0;pointer-events:none}
#dust{position:absolute;inset:0;width:100%;height:100%}
.beam{position:absolute;top:-30%;width:38cqmax;height:160%;background:linear-gradient(rgba(255,226,150,.22),rgba(255,226,150,0) 80%);clip-path:polygon(45% 0,55% 0,100% 100%,0 100%);filter:blur(6px);transform-origin:50% 0;mix-blend-mode:screen}
.b1{left:5%;animation:swing 7s ease-in-out infinite}
.b2{right:5%;animation:swing 8s ease-in-out infinite reverse}
@keyframes swing{0%,100%{transform:rotate(-24deg)}50%{transform:rotate(18deg)}}
.intro .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center}
.emb{position:relative;width:min(42cqw,300px);aspect-ratio:2/1;display:flex;align-items:center;justify-content:center;transition:transform 1s cubic-bezier(.6,-0.3,.3,1),opacity .6s}
.intro.open .emb{transform:scale(4);opacity:0}
.intro.open h2,.intro.open p,.intro.open .cta{opacity:0;transition:opacity .4s}
.halo{position:absolute;width:150%;aspect-ratio:1;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(255,215,120,.55),transparent 30%,transparent 50%,rgba(255,215,120,.45),transparent 80%);-webkit-mask:radial-gradient(circle,transparent 58%,#000 60%,#000 62%,transparent 64%);mask:radial-gradient(circle,transparent 58%,#000 60%,#000 62%,transparent 64%);animation:spin 6s linear infinite}
.halo.h2{width:120%;animation-duration:9s;animation-direction:reverse;opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}

@keyframes float{50%{transform:translateY(-8px)}}
.intro h2{margin-top:4cqh;font-family:"Cinzel",serif;font-size:clamp(24px,5.2cqw,60px);font-weight:700;letter-spacing:.14em;background:linear-gradient(100deg,#b07a1c 20%,#fff6cf 40%,#efc35a 50%,#b07a1c 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.intro p{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:500;font-size:clamp(14px,2cqw,22px);letter-spacing:.12em;color:#ecd6a6}
.cta{margin-top:4cqh;font-family:"Cinzel",serif;font-size:12px;font-weight:600;letter-spacing:.38em;color:#fff3c4;padding:12px 26px;border:1px solid rgba(232,196,106,.6);border-radius:40px;animation:breathe 2s ease-in-out infinite}
@keyframes breathe{50%{box-shadow:0 0 26px rgba(232,196,106,.5);background:rgba(232,196,106,.08)}}
.lg{position:absolute;top:max(14px,env(safe-area-inset-top));right:14px;background:none;border:1px solid rgba(232,196,106,.5);color:#e8c46a;font:700 12px "Cinzel",Georgia,serif;padding:6px 12px;border-radius:20px;cursor:pointer}
/* certificate reveal: circle of light */
.stage{clip-path:circle(0% at 50% 50%)}
.stage.reveal{animation:iris 1.6s cubic-bezier(.7,0,.2,1) forwards}
@keyframes iris{to{clip-path:circle(75% at 50% 50%)}}
.stage.shown{clip-path:none}
.ring{position:absolute;left:50%;top:50%;width:20px;height:20px;transform:translate(-50%,-50%);border-radius:50%;border:3px solid #ffe08a;box-shadow:0 0 30px #ffd36a,inset 0 0 20px #ffd36a;pointer-events:none;z-index:9;animation:wave 1.4s ease-out forwards}
@keyframes wave{from{width:20px;height:20px;opacity:1}to{width:260cqmax;height:260cqmax;opacity:0}}
/* launch light rays + vignette */
.rays{position:absolute;inset:-50%;z-index:3;pointer-events:none;opacity:0;background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,220,130,.09) 0 5deg,transparent 6deg 18deg);mix-blend-mode:screen;transition:opacity 1s;animation:spin 30s linear infinite}
.rays.on{opacity:1}
.vig{position:absolute;inset:0;z-index:2;pointer-events:none;opacity:0;transition:opacity 1.2s;background:radial-gradient(ellipse 45% 35% at 50% 82%,transparent 40%,rgba(5,0,1,.82))}
.vig.on{opacity:1}
.rotate{display:none !important;font-size:12px;letter-spacing:.15em;color:#e8c46a;margin-top:14px}
@media (orientation:portrait){.rotate{display:block}}

/* small controls, only after launch (or tiny Padam while waiting) */
.tools{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;padding:6px;border-radius:40px;background:rgba(20,3,4,.72);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(232,196,106,.35);z-index:4;transition:opacity .5s,transform .5s}
.tools.ghost{opacity:0;transform:translateX(-50%) translateY(20px);pointer-events:none}
.tb{border:0;background:none;color:#f3d98e;font:700 12px "Cinzel",Georgia,serif;padding:9px 14px;border-radius:30px;cursor:pointer;white-space:nowrap}
.tb:hover{background:rgba(232,196,106,.14)}
.tb.main{background:linear-gradient(#f5d77e,#c8932f);color:#3a0a0c}
.erase{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));z-index:4;border:1px solid rgba(232,196,106,.35);background:rgba(20,3,4,.55);color:#e8c46a;font:700 11px "Cinzel",Georgia,serif;padding:7px 12px;border-radius:20px;cursor:pointer;opacity:0;pointer-events:none;transition:opacity .4s}
.erase.on{opacity:.75;pointer-events:auto}

.count{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:7;pointer-events:none;font-weight:900;font-size:min(36cqw,36cqh);color:#f7dc8a;text-shadow:0 0 60px rgba(247,220,138,.6),0 8px 30px #000}
.count i{font-style:normal;animation:cnt .9s ease-out both}
@keyframes cnt{from{opacity:0;transform:scale(2.4)}30%{opacity:1;transform:scale(1)}to{opacity:0;transform:scale(.6)}}
#fx{position:absolute;inset:0;pointer-events:none;z-index:5}

/* announcement */
.ann{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none;opacity:0;transition:opacity .6s;background:radial-gradient(ellipse 70% 55%,rgba(25,3,5,.88),rgba(25,3,5,.35) 70%,transparent)}
.ann.show{opacity:1}
.ann>*{opacity:0;transform:translateY(24px) scale(.96);transition:all .8s cubic-bezier(.2,1.2,.4,1)}
.ann.show>*{opacity:1;transform:none}
.ann .a1{font-family:"Great Vibes",cursive;font-size:clamp(30px,5.2cqw,66px);color:#f6dc97;text-shadow:0 2px 14px rgba(0,0,0,.8);transition-delay:.1s;line-height:1}
.ann .a2{font-family:"Cinzel",serif;font-size:clamp(26px,6cqw,76px);font-weight:700;letter-spacing:.06em;line-height:1.05;margin:4px 0 6px;background:linear-gradient(100deg,#b8862b 10%,#fff6cf 35%,#efc35a 50%,#c08a2a 70%,#fff0b8 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 14px rgba(0,0,0,.8));transition-delay:.5s}
.ann.show .a2{animation:shine 3.5s linear 1.2s infinite}
.ann .a3{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:600;font-size:clamp(16px,2.6cqw,32px);letter-spacing:.14em;color:#fff6e2;text-shadow:0 2px 10px #000;transition-delay:.9s}
.ann .orn{width:clamp(220px,40cqw,520px);height:auto;margin:clamp(6px,1.6cqh,16px) 0 0;transition-delay:1.2s}
.ann .a4{font-family:"Great Vibes",cursive;font-size:clamp(56px,11cqw,150px);line-height:1;margin-top:-.08em;padding:0 .2em .1em;background:linear-gradient(#fff8d8,#f3c95c 50%,#b8822a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 22px rgba(255,205,100,.45)) drop-shadow(0 6px 12px rgba(0,0,0,.8));transition-delay:1.6s}
.ann.show .a4{animation:glow 2.2s ease-in-out 2.6s infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 40px rgba(255,220,130,.85)) drop-shadow(0 6px 12px rgba(0,0,0,.8))}}

.modal{position:absolute;inset:0;background:rgba(10,2,3,.95);z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.modal.open{display:flex}
.modal img{max-width:94cqw;max-height:70cqh;border-radius:4px;box-shadow:0 10px 40px #000;-webkit-user-select:auto;user-select:auto;-webkit-touch-callout:default;pointer-events:auto}
.modal p{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:17px;color:#e8d2a8;text-align:center}
.modal small{font-family:system-ui,sans-serif;font-size:11px;color:#a8877a;text-align:center}
.modal small a{color:#d9b977;text-decoration:none}
.modal small a:hover,.modal small a:active{text-decoration:underline}
.modal .tb{border:1px solid #c79a45}
</style>

/* ================= MUSIC (generated live, no files) ================= */
let AC=null,master=null,rev=null,bed=null,hbTimer=null;
function audio(){if(AC)return;try{AC=new(window.AudioContext||window.webkitAudioContext)();
 const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=4;comp.connect(AC.destination);
 master=AC.createGain();master.gain.value=.9;master.connect(comp);
 rev=AC.createConvolver();const len=AC.sampleRate*3,ir=AC.createBuffer(2,len,AC.sampleRate);for(let c=0;c<2;c++){const d=ir.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}
 rev.buffer=ir;const rg=AC.createGain();rg.gain.value=.35;rev.connect(rg).connect(master)}catch(e){AC=null}}
function out(node,wet=.4){node.connect(master);if(wet){const g=AC.createGain();g.gain.value=wet;node.connect(g).connect(rev)}}
function noiseBuf(sec){const b=AC.createBuffer(1,AC.sampleRate*sec,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b}
function kick(t,v=1,f=70){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(f*2.2,t);o.frequency.exponentialRampToValueAtTime(f*.6,t+.25);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.6);o.connect(g);out(g,.15);o.start(t);o.stop(t+.7)}
function snare(t,v=.5){const s=AC.createBufferSource();s.buffer=noiseBuf(.25);const f=AC.createBiquadFilter();f.type="bandpass";f.frequency.value=1800;f.Q.value=.7;const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+.18);s.connect(f).connect(g);out(g,.3);s.start(t)}
/* suspense bed: dark drone + string tremolo + heartbeat */
function startBed(){audio();if(!AC)return;AC.resume&&AC.resume();const t=AC.currentTime;bed=AC.createGain();bed.gain.setValueAtTime(.0001,t);bed.gain.exponentialRampToValueAtTime(.55,t+3);
 const lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=380;lp.Q.value=4;const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.09;lg.gain.value=160;lfo.connect(lg).connect(lp.frequency);lfo.start();
 [[55,"sawtooth",.3],[55.35,"sawtooth",.3],[82.4,"sawtooth",.16],[110.6,"triangle",.12]].forEach(([f,ty,v])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.value=v;o.connect(g).connect(lp);o.start();bed._o=(bed._o||[]).concat(o)});
 lp.connect(bed);// high tension strings (minor second rub), tremolo
 const hs=AC.createGain();hs.gain.value=0;hs.gain.linearRampToValueAtTime(.05,t+8);const trem=AC.createOscillator(),tg=AC.createGain();trem.frequency.value=7;tg.gain.value=.03;trem.connect(tg).connect(hs.gain);trem.start();
 [659.3,698.5].forEach(f=>{const o=AC.createOscillator();o.type="sawtooth";o.frequency.value=f;const bf=AC.createBiquadFilter();bf.type="lowpass";bf.frequency.value=1800;o.connect(bf).connect(hs);o.start();bed._o.push(o)});
 hs.connect(bed);bed._o.push(lfo,trem);out(bed,.5);
 let beat=1.05;const hb=()=>{if(!bed)return;const n=AC.currentTime+.05;kick(n,.85,55);kick(n+.22,.55,55);hbTimer=setTimeout(hb,beat*1000)};hb();bed._setBeat=b=>beat=b}
function tension(){if(!AC||!bed)return;bed._setBeat(.62);}
/* drumroll + riser before launch */
function roll(dur){if(!AC)return;const t0=AC.currentTime;let t=t0,gap=.13;while(t<t0+dur){snare(t,.18+.5*(t-t0)/dur);gap=Math.max(.035,gap*.93);t+=gap}
 const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o.type="sawtooth";o.frequency.setValueAtTime(110,t0);o.frequency.exponentialRampToValueAtTime(880,t0+dur);f.type="lowpass";f.frequency.setValueAtTime(300,t0);f.frequency.exponentialRampToValueAtTime(5000,t0+dur);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.22,t0+dur);g.gain.linearRampToValueAtTime(0,t0+dur+.05);o.connect(f).connect(g);out(g,.3);o.start(t0);o.stop(t0+dur+.1)
 const s=AC.createBufferSource();s.buffer=noiseBuf(dur);const hp=AC.createBiquadFilter();hp.type="highpass";hp.frequency.setValueAtTime(800,t0);hp.frequency.exponentialRampToValueAtTime(9000,t0+dur);const ng=AC.createGain();ng.gain.setValueAtTime(.0001,t0);ng.gain.exponentialRampToValueAtTime(.25,t0+dur);ng.gain.linearRampToValueAtTime(0,t0+dur+.02);s.connect(hp).connect(ng);out(ng,.2);s.start(t0)}
/* the big hit + fanfare */
function brass(freqs,t,d,v){freqs.forEach(fq=>{[0,4,-4].forEach(dt=>{const o=AC.createOscillator(),f=AC.createBiquadFilter(),g=AC.createGain();o.type="sawtooth";o.frequency.value=fq;o.detune.value=dt;f.type="lowpass";f.frequency.setValueAtTime(600,t);f.frequency.linearRampToValueAtTime(3200,t+.08);f.frequency.exponentialRampToValueAtTime(1400,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.04);g.gain.setValueAtTime(v,t+d*.7);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(f).connect(g);out(g,.5);o.start(t);o.stop(t+d+.05)})})}
function bell(f,t,v=.12){const o=AC.createOscillator(),g=AC.createGain();o.type="sine";o.frequency.value=f;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+2.5);o.connect(g);out(g,.7);o.start(t);o.stop(t+2.6)}
function impact(){if(!AC)return;const t=AC.currentTime+.02;
 if(bed){clearTimeout(hbTimer);bed.gain.cancelScheduledValues(t);bed.gain.setValueAtTime(bed.gain.value,t);bed.gain.exponentialRampToValueAtTime(.0001,t+.4);const b=bed;bed=null;setTimeout(()=>b._o.forEach(o=>{try{o.stop()}catch(e){}}),800)}
 const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(90,t);o.frequency.exponentialRampToValueAtTime(28,t+2.2);g.gain.setValueAtTime(1.2,t);g.gain.exponentialRampToValueAtTime(.001,t+2.6);o.connect(g);out(g,.3);o.start(t);o.stop(t+2.7);
 const s=AC.createBufferSource();s.buffer=noiseBuf(4);const hp=AC.createBiquadFilter();hp.type="highpass";hp.frequency.value=4000;const cg=AC.createGain();cg.gain.setValueAtTime(.5,t);cg.gain.exponentialRampToValueAtTime(.001,t+3.8);s.connect(hp).connect(cg);out(cg,.6);s.start(t);
 const n=AC.createBufferSource();n.buffer=noiseBuf(1);const lp=AC.createBiquadFilter();lp.type="lowpass";lp.frequency.value=400;const ng=AC.createGain();ng.gain.setValueAtTime(.9,t);ng.gain.exponentialRampToValueAtTime(.001,t+.8);n.connect(lp).connect(ng);out(ng,.4);n.start(t);
 const C=[130.8,196,261.6,329.6,392],F=[174.6,220,261.6,349.2,440],G=[196,246.9,293.7,392,493.9],C2=[130.8,196,261.6,329.6,392,523.3];
 brass(C,t,.5,.05);brass(C,t+.55,.22,.05);brass(C,t+.8,.22,.05);brass(F,t+1.05,.45,.05);brass(G,t+1.55,.45,.05);brass(C2,t+2.05,3.6,.055);
 [t+.55,t+.8,t+1.05,t+1.55,t+2.05].forEach((x,i)=>{kick(x,.9,60);snare(x,.35)});
 [1046.5,1318.5,1568,2093].forEach((f,i)=>bell(f,t+2.1+i*.14));
 // warm triumphant pad afterwards
 const pad=AC.createGain();pad.gain.setValueAtTime(.0001,t+3);pad.gain.exponentialRampToValueAtTime(.08,t+5);pad.gain.exponentialRampToValueAtTime(.0001,t+16);
 C2.forEach(f=>{const p=AC.createOscillator(),pf=AC.createBiquadFilter();p.type="triangle";p.frequency.value=f;pf.type="lowpass";pf.frequency.value=1400;p.connect(pf).connect(pad);p.start(t+3);p.stop(t+16.5)});out(pad,.6)}
function tick(){if(!AC)return;const t=AC.currentTime;kick(t,.7,90);const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=1320;g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.2);o.connect(g);out(g,.3);o.start(t);o.stop(t+.25)}

/* ================= layout: always landscape ================= */
const stage=$("stage"),pad=$("pad"),ctx=pad.getContext("2d"),R=1080/764;let rot=false,W=0,H=0;
let AW=innerWidth,AH=innerHeight;const app=$("app");
function appSize(){const vw=innerWidth,vh=innerHeight;rot=vh>vw*1.05;AW=rot?vh:vw;AH=rot?vw:vh;
 app.style.width=AW+"px";app.style.height=AH+"px";app.style.transform=rot?"rotate(90deg) translateY(-100%)":"none";
 if(typeof fx!=="undefined"){fx.width=AW;fx.height=AH}if(typeof dc!=="undefined"){dc.width=AW;dc.height=AH}}
function toApp(cx,cy){return rot?{x:cy,y:innerWidth-cx}:{x:cx,y:cy}}
function layout(){appSize();let w=AW,h=w/R;if(h>AH){h=AH;w=h*R}
 stage.style.width=w+"px";stage.style.height=h+"px";
 W=w;H=h;const d=Math.min(3,window.devicePixelRatio||1);pad.width=w*d;pad.height=h*d;ctx.setTransform(d,0,0,d,0,0);redraw()}
addEventListener("resize",layout);addEventListener("orientationchange",()=>setTimeout(layout,250));

/* ================= pen (fixed gold ink) ================= */
const INK="#ffe08a";let strokes=[],cur=null,locked=true,opened=false,launched=false,idle=null;
function drawStroke(c,s,w,h){if(s.p.length<2)return;const sc=h/560;c.strokeStyle=s.c;c.lineCap="round";c.lineJoin="round";
 for(let i=1;i<s.p.length;i++){const a=s.p[i-1],b=s.p[i];c.lineWidth=b.w*sc;c.beginPath();const m0=i>1?{x:(s.p[i-2].x+a.x)/2,y:(s.p[i-2].y+a.y)/2}:a,m1={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
  c.moveTo(m0.x*w,m0.y*h);c.quadraticCurveTo(a.x*w,a.y*h,m1.x*w,m1.y*h);c.stroke()}}
function redraw(){ctx.clearRect(0,0,W,H);ctx.save();ctx.shadowColor="rgba(0,0,0,.35)";ctx.shadowBlur=2;ctx.shadowOffsetY=1;strokes.forEach(s=>drawStroke(ctx,s,W,H));if(cur)drawStroke(ctx,cur,W,H);ctx.restore()}
function pos(e){const r=pad.getBoundingClientRect();let u,v;if(rot){u=(e.clientY-r.top)/r.height;v=(r.right-e.clientX)/r.width}else{u=(e.clientX-r.left)/r.width;v=(e.clientY-r.top)/r.height}return{x:u,y:v,t:performance.now()}}
pad.addEventListener("pointerdown",e=>{if(locked)return;e.preventDefault();clearTimeout(idle);pad.setPointerCapture(e.pointerId);const p=pos(e);p.w=3.4;cur={c:INK,p:[p]};$("bErase").classList.remove("on");if(strokes.length==0)tension()});
pad.addEventListener("pointermove",e=>{if(!cur)return;const evs=e.getCoalescedEvents?e.getCoalescedEvents():[e];
 evs.forEach(ev=>{const p=pos(ev),l=cur.p[cur.p.length-1],dist=Math.hypot((p.x-l.x)*W,(p.y-l.y)*H),v=dist/Math.max(1,p.t-l.t);if(dist<0.7)return;const t=Math.max(1.2,Math.min(4.6,4.8-v*1.5));p.w=l.w*.65+t*.35;cur.p.push(p)});redraw();
 if(Math.random()<.5){const c=["#fff3c4","#ffe08a","#ffffff"];const q=toApp(e.clientX,e.clientY);for(let i=0;i<2;i++)parts.push({x:q.x,y:q.y,vx:(Math.random()-.5)*2.5,vy:-Math.random()*2.2,g:.06,s:1.5+Math.random()*2.5,r:0,vr:0,c:c[i%3],life:40+Math.random()*25,o:1});if(!anim)loop()}});
function end(){if(!cur)return;if(cur.p.length==1){const p=cur.p[0];cur.p.push({x:p.x+.0008,y:p.y,w:3.2})}strokes.push(cur);cur=null;redraw();
 // auto launch once the pen rests for 2.2s
 $("bErase").classList.add("on");clearTimeout(idle);idle=setTimeout(launch,2200)}
pad.addEventListener("pointerup",end);pad.addEventListener("pointercancel",end);
$("bErase").onclick=()=>{clearTimeout(idle);strokes=[];redraw();$("bErase").classList.remove("on")};

/* ================= intro ================= */
const dc=$("dust"),dx=dc.getContext("2d");let dust=[],dOn=true;

for(let i=0;i<140;i++)dust.push({x:Math.random(),y:Math.random(),r:.5+Math.random()*2.2,v:.0003+Math.random()*.0012,p:Math.random()*6.28});
(function dl(){if(!dOn)return;dx.clearRect(0,0,dc.width,dc.height);dust.forEach(d=>{d.y-=d.v;d.p+=.03;if(d.y<-.02){d.y=1.02;d.x=Math.random()}
 const a=.35+.45*Math.sin(d.p);dx.fillStyle="rgba(255,214,120,"+a+")";dx.beginPath();dx.arc(d.x*dc.width+Math.sin(d.p)*6,d.y*dc.height,d.r,0,7);dx.fill()});requestAnimationFrame(dl)})();
function shatter(){const cx=AW/2,cy=AH/2-AH*.12,cols=["#fff3c4","#f7dc8a","#e2ac3f"];
 for(let i=0;i<220;i++){const a=Math.random()*6.283,sp=2+Math.random()*12;parts.push({x:cx+(Math.random()-.5)*120,y:cy+(Math.random()-.5)*50,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:.05,s:2+Math.random()*4,r:0,vr:0,c:cols[i%3],life:110,o:1})}if(!anim)loop()}
$("intro").onclick=()=>{if(opened)return;opened=true;const d=document.documentElement;
 try{const p=(d.requestFullscreen||d.webkitRequestFullscreen).call(d);p&&p.then(()=>{try{screen.orientation.lock("landscape").catch(()=>{})}catch(e){}}).catch(()=>{})}catch(e){}
 startBed();braam();$("intro").classList.add("open");
 setTimeout(()=>{shatter();const r=document.createElement("div");r.className="ring";document.body.appendChild(r);setTimeout(()=>r.remove(),1500);layout();stage.classList.add("reveal")},700);
 setTimeout(()=>{stage.classList.add("shown");stage.classList.remove("reveal");dOn=false;locked=false;layout()},2400)};
function braam(){if(!AC)return;const t=AC.currentTime;kick(t,1.1,40);brass([65.4,98,130.8,155.6,196],t+.05,2.6,.045);
 const s=AC.createBufferSource();s.buffer=noiseBuf(2);const f=AC.createBiquadFilter();f.type="lowpass";f.frequency.setValueAtTime(200,t);f.frequency.exponentialRampToValueAtTime(3000,t+.8);const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25,t+.7);g.gain.exponentialRampToValueAtTime(.001,t+1.6);s.connect(f).connect(g);out(g,.5);s.start(t)}
/* ================= launch ================= */
const fx=$("fx"),fc=fx.getContext("2d");let parts=[],anim=false;appSize();
function burst(){const cols=["#f7dc8a","#e2ac3f","#fff3c4","#b3121b","#ffffff"];
 for(let k=0;k<2;k++)for(let i=0;i<140;i++){const lf=k==0;parts.push({x:lf?0:AW,y:AH*.85,vx:(lf?1:-1)*(4+Math.random()*11),vy:-(9+Math.random()*14),g:.27,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%5],life:240})}
 for(let i=0;i<100;i++){const a=Math.random()*6.283,sp=3+Math.random()*9;parts.push({x:AW/2,y:AH/2,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-3,g:.13,s:3+Math.random()*4,r:0,vr:0,c:cols[i%3],life:180,o:1})}if(!anim)loop()}
function firework(x,y){const cols=[["#fff3c4","#f7dc8a"],["#ffffff","#ffe08a"],["#e2ac3f","#fff3c4"],["#ff5a5f","#f7dc8a"]][Math.floor(Math.random()*4)];
 for(let i=0;i<70;i++){const a=i/70*6.283,sp=2.5+Math.random()*3.5;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,g:.05,s:2+Math.random()*2.5,r:0,vr:0,c:cols[i%2],life:80+Math.random()*30,o:1})}
 if(AC){const t=AC.currentTime,n=AC.createBufferSource();n.buffer=noiseBuf(.6);const f=AC.createBiquadFilter();f.type="lowpass";f.frequency.value=1200;const g=AC.createGain();g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.5);n.connect(f).connect(g);out(g,.6);n.start(t)}if(!anim)loop()}
function fireworks(){for(let i=0;i<9;i++)setTimeout(()=>firework(AW*(.12+Math.random()*.76),AH*(.12+Math.random()*.4)),600+i*450)}
function rain(){const cols=["#f7dc8a","#e2ac3f","#fff3c4","#ffffff"];for(let i=0;i<160;i++)parts.push({x:Math.random()*AW,y:-20-Math.random()*AH*.6,vx:(Math.random()-.5)*1.5,vy:1+Math.random()*2,g:.03,s:4+Math.random()*6,r:Math.random()*6,vr:(Math.random()-.5)*.2,c:cols[i%4],life:420});if(!anim)loop()}
function loop(){anim=true;fc.clearRect(0,0,fx.width,fx.height);parts=parts.filter(p=>p.life-->0&&p.y<fx.height+40);
 parts.forEach(p=>{p.vx*=.99;p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;fc.save();fc.globalAlpha=Math.min(1,p.life/60);fc.translate(p.x,p.y);fc.rotate(p.r);fc.fillStyle=p.c;if(p.o){fc.beginPath();fc.arc(0,0,p.s/2,0,7);fc.fill()}else fc.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);fc.restore()});
 if(parts.length)requestAnimationFrame(loop);else{anim=false;fc.clearRect(0,0,fx.width,fx.height)}}
function launch(){if(launched||!strokes.length)return;launched=locked=true;$("bErase").classList.remove("on");stage.classList.add("tense");$("vig").classList.add("on");
 roll(2.6);setTimeout(boom,2600)}
function boom(){$("vig").classList.remove("on");$("rays").classList.add("on");setTimeout(()=>$("rays").classList.remove("on"),8000);fireworks();const r=document.createElement("div");r.className="ring";document.body.appendChild(r);setTimeout(()=>r.remove(),1500);stage.classList.remove("tense","launch");void stage.offsetWidth;stage.classList.add("launch");impact();burst();setTimeout(burst,600);setTimeout(rain,1400);
 const a=$("ann");a.classList.add("show");setTimeout(()=>{a.classList.remove("show");$("tools").classList.remove("ghost")},7500)}
$("bAgain").onclick=()=>{$("rays").classList.remove("on");$("tools").classList.add("ghost");strokes=[];redraw();launched=false;locked=false;startBed()};

/* ================= save ================= */
$("bSave").onclick=()=>{const img=$("cert"),S=2,cw=img.naturalWidth*S,ch=img.naturalHeight*S,c=document.createElement("canvas");c.width=cw;c.height=ch;const x=c.getContext("2d");
 x.imageSmoothingQuality="high";x.drawImage(img,0,0,cw,ch);x.shadowColor="rgba(0,0,0,.35)";x.shadowBlur=2*S;x.shadowOffsetY=S;strokes.forEach(s=>drawStroke(x,s,cw,ch));$("out").src=c.toDataURL("image/png");$("modal").classList.add("open")};
